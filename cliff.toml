# git-cliff config — auto-generated by publish.py
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n"""
trim = true
footer = ""
# A CHANGELOG bullet whose text begins with an issue ref renders as a malformed
# Atx heading and trips pymarkdown MD018 — re-failing the publish lint forever
# (same failure class the commit_preprocessors below guard). This happens when a
# commit subject's text after the conventional-commit prefix starts with `#NN`
# (e.g. `docs(trdd): #56 …` → git-cliff strips the type → bullet `- #56 …`).
# Escape a `#` at the very start of a list item so it is literal text, not a
# heading; the visible "#56" is preserved. Postprocessors run on the FINAL
# rendered changelog, so this catches the case regardless of which commit caused it.
postprocessors = [
  { pattern = '(?m)^(- )#', replace = '$1\#' },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Strip leading/trailing spaces inside inline-code spans so the rendered
# CHANGELOG doesn't trip pymarkdown MD038. A commit subject like
# `fix(rules): drop trailing space inside ` + "`safe-deleted: `" + ` code span`
# would otherwise propagate the trailing-space backtick literally into
# CHANGELOG.md and re-fail the publish-pipeline lint forever. Two passes:
# (1) trailing space inside a backtick pair; (2) leading space. Both regex
# patterns require a non-backtick run so neither matches "` ` ` `" runs.
commit_preprocessors = [
  { pattern = '`([^`]+) `', replace = '`$1`' },
  { pattern = '` ([^`]+)`', replace = '`$1`' },
]
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^docs", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Tests" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^security", group = "Security" },
  { body = ".*security", group = "Security" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = "v0.0.0"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
