[package]
name = "memgrep"
# 0.2.0: CLI contract changed (update-mem-atom --status, refusal of a no-op update, lint rule
# WMPAGE-012). The index SCHEMA_VERSION is deliberately untouched.
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
comrak = "0.52.0"
globset = "0.4.18"
ignore = "0.4.26"
libc = "0.2.189"
regex = "1.12.3"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
toml = "1.1.6"
ureq = "2"
