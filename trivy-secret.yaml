# The janitor R6 detector (scripts/lib/gcp_iam_impersonation_patterns.py) documents
# its own signature in a comment: `# "type": "service_account" + private_key_id (40-char hex) ...`.
# That is a description of a key, not a credential. Trivy's allow-rule `path` skips a whole
# file for every rule, and an allow-rule `regex` is tested only against the matched text
# (`"type": "service_account"`, identical to a real key), so neither can be narrow. An
# exclude-block is tested against the surrounding file content, so it can require the
# exact comment context: a real key file never contains this prose after the match.
exclude-block:
  description: Detector comment describing the GCP SA key signature (janitor R6); prose, not a credential
  # The regex stops before the comment's word 'hex': CPV skillaudit's CRYPTO_THEFT
  # pattern (private[_-]?key.*(?:0x|hex|wallet)) fires when both share a line (CPV #266).
  # The prefix still spans Trivy's matched text, so the exclusion is unchanged.
  regexes:
    - '# "type": "service_account" \+ private_key_id \(40-char '
