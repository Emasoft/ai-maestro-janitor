# Narrow allow-rule: the janitor R6 detector regex (gcp-iam-sa-key-file-committed)
# contains the literal signature text of a GCP service-account key. It is a
# detection pattern, not a credential. Scoped to this one file only.
allow-rules:
  - id: janitor-gcp-sa-detector-signature
    description: Detector regex for rule R6 (gcp-iam-sa-key-file-committed); signature text, not a credential
    path: scripts/lib/gcp_iam_impersonation_patterns\.py$
