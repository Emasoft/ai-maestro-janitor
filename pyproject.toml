[project]
name = "ai-maestro-janitor"
version = "0.4.0"
description = "Session-scoped janitor for Claude Code"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyyaml"]

[tool.ruff]
line-length = 320

[tool.mypy]
ignore_missing_imports = true

# Pyright treats scripts/lib/ as an extra search root so detectors that
# bootstrap sys.path at runtime still type-check cleanly. Without this
# every detector raises "Import 'state' could not be resolved" because
# pyright can't follow the sys.path.insert idiom.
[tool.pyright]
extraPaths = ["scripts/lib"]
