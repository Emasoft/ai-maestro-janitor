[project]
name = "ai-maestro-janitor"
version = "0.37.0"
description = "Session-scoped janitor for Claude Code"
# Project tooling (ruff, mypy, the publish.py pipeline) needs ≥3.11
# because cliff config + tomllib usage. The standalone PEP 723 scripts
# under scripts/ also pin ≥3.11 for parity — see scripts/**/*.py headers.
requires-python = ">=3.11"
license = "MIT"
# No runtime deps: every script is stdlib-only at runtime, and any
# uv-injected `--with <pkg>` (publish.py linters) is self-contained.
dependencies = []

[tool.pytest.ini_options]
# Pin collection to the repo's own suite. Without this, a bare `pytest` from the
# repo root collects gitignored _dev trees (e.g. downloads_dev/ foreign projects
# whose scripts run at import and call sys.exit → pytest INTERNALERROR).
testpaths = ["tests"]

[tool.ruff]
line-length = 320

[tool.ruff.lint]
# Match the CPV publish-gate ruleset (cpv-remote-validate runs ruff with
# `--select=E,F,W,I --ignore=E501`) so local `ruff check .` == the gate.
# Without I (isort), local lint passed while the gate flagged 412 unsorted
# imports — keeping them in sync prevents that surprise on every publish.
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true

# Pyright config lives in pyrightconfig.json (canonical location). When
# both files declare [tool.pyright]/pyrightconfig.json, pyright IGNORES
# pyproject.toml — so any [tool.pyright] block here would be dead config.
# Keep all pyright settings in pyrightconfig.json for a single source of truth.
