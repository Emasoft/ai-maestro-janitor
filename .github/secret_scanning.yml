# ai-maestro-janitor is a security-scanner plugin. Its test corpus
# (tests/test_*_patterns.py) contains FAKE, synthetic example secrets used
# ONLY to verify the plugin's own secret-DETECTION regexes fire correctly —
# they are not real credentials and never were. Exclude the test corpus from
# secret scanning so the scanner's own fixtures don't trip GitHub's detectors.
paths-ignore:
  - "tests/**"
