name: Weekly janitor audit

on:
  schedule:
    # Mondays 09:11 UTC. The previous "0 9 * * 1" landed in the global
    # Monday-9am pile-up; ~/.claude/rules/gh-actions.md asks every
    # weekly job to pick an off-minute that is NOT 00 or 30.
    - cron: "11 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          # `gh` calls below use GH_TOKEN from env explicitly — the
          # persisted git extraheader credential would be exfiltrable by
          # any later step uploading artifacts. zizmor: artipacked.
          persist-credentials: false

      - name: Install uv
        # SHA-pinned per ~/.claude/rules/gh-actions.md + zizmor's
        # unpinned-uses error. Same SHA as ci.yml and release.yml.
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0

      - name: Make detector scripts executable
        run: chmod +x scripts/dispatch.py scripts/detectors/*.py scripts/hooks/*.py

      - name: Run drift detectors (one-shot)
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
          CLAUDE_PLUGIN_OPTION_GITHUB_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          mkdir -p .janitor/state .janitor/logs
          REPORT=$(
            for d in ./scripts/detectors/*.py; do
              "$d" || true
            done
          )
          printf '%s\n' "$REPORT" | tee audit-report.txt
          if [ -s audit-report.txt ]; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          fi

      # `gh issue create --label janitor` returns HTTP 422 if the label
      # doesn't exist on the repo, and the entire step would fail silently
      # from the user's POV (the audit ran, the issue never opened).
      # `gh label create --force` is idempotent: creates the label on
      # first run, no-ops on subsequent runs. The `|| true` swallows any
      # other transient error (the issue-creation step still tries).
      - name: Ensure janitor label exists
        if: steps.audit.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create janitor \
            --description "Drift surfaced by ai-maestro-janitor weekly audit" \
            --color "fbca04" \
            --force || true

      - name: Open issue if drift found
        if: steps.audit.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Weekly janitor audit found drift ($(date -u +%Y-%m-%d))" \
            --body-file audit-report.txt \
            --label janitor
