name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    # Bound the job so a transit-degraded `uvx` clone in "Validate plugin
    # (strict)" fails fast instead of zombie-hanging to GitHub's 6h max
    # (task #243; see memory: stuck-release-ci-not-publish-blocked). The
    # release itself is created locally by publish.py, so a bound is safe.
    #
    # 15 was too tight and killed the gate on v0.35.2 AND v0.35.3. Measured
    # on run 29021326527: `uvx` install finished 4s in; the step then spent
    # 13m21s inside CPV's REPO LINT and was cancelled mid-lint. Cause: this
    # repo vendors a full Rust crate (scripts/memgrep/), REPO LINT detects
    # `rust` and lints its 9 files, and a CI runner compiles it from COLD
    # (locally `target/` is warm — the whole validate takes ~1m07s).
    #
    # A killed gate is WORSE than a slow one: it never reaches a verdict, so
    # it asserts nothing while showing a red badge nobody reads. Raising the
    # bound RESTORES the check rather than skipping it. 30 still bounds the
    # zombie case an order of magnitude below GitHub's 6h.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          # Release workflow does not need persisted git credentials in
          # the local repo — gh release create uses GITHUB_TOKEN from env
          # explicitly. Closes zizmor's artipacked finding.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          # Disable uv's cache on the release path. A cache poisoned by a
          # prior PR build could otherwise contaminate the release-time
          # `uvx` invocation below. CI gets the cache; release does not.
          # See zizmor's cache-poisoning audit.
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Validate plugin (strict)
        # PINNED to a released CPV tag. Unpinned, this resolved the upstream
        # DEFAULT BRANCH and executed whatever was on it inside a job holding
        # `contents: write` on this repo — a supply-chain hole (one bad commit
        # upstream = write access here) and non-reproducible releases. The pin
        # must match publish.py's local gate exactly, or a release can pass
        # locally and fail here (or worse, the reverse).
        #
        # BUMP PROTOCOL: raise both this tag and the one in publish.py in the
        # same commit, after checking `gh api repos/Emasoft/claude-plugins-\
        # validation/releases/latest`. Note issue #71's fix (CPV PR #157,
        # A2A false positive) only arrives here once it is RELEASED and the
        # pin is bumped — that is the intended, greppable behaviour.
        run: |
          set +e
          uvx --from git+https://github.com/Emasoft/claude-plugins-validation@v2.153.1 --with pyyaml cpv-remote-validate plugin . --strict
          exit_code=$?
          set -e
          if [ $exit_code -ge 1 ] && [ $exit_code -le 4 ]; then
            echo "::error::Validation failed (exit code $exit_code)"
            exit $exit_code
          fi

      - name: Check if release already exists
        id: release_exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists (created by scripts/publish.py) — skipping create step"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG not yet present — workflow will create it"
          fi

      - name: Generate changelog
        if: steps.release_exists.outputs.exists == 'false'
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
          fi
          echo "$CHANGELOG" > changelog.txt

      - name: Create GitHub Release
        if: steps.release_exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          body_path: changelog.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
