name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    # Bound the job so a transit-degraded `uvx` clone in "Validate plugin
    # (strict)" fails fast instead of zombie-hanging to GitHub's 6h max
    # (task #243; see memory: stuck-release-ci-not-publish-blocked). The
    # release itself is created locally by publish.py, so a bound is safe.
    #
    # 15 killed the gate on v0.35.2 AND v0.35.3. On run 29021326527 `uvx`
    # install finished 4s in and the step then spent 13m21s inside CPV's
    # REPO LINT (which lints this repo's vendored Rust crate, scripts/memgrep,
    # with no warm target/) before being cancelled mid-lint.
    #
    # That is WHERE the time went, not WHY: run 29027974286 ran the same phase
    # on the same cold-runner conditions in 198s. So REPO LINT costs ~3m, and a
    # >13m one is a STALL (a wedged cargo/network fetch), not the normal cost.
    # Do not "fix" a stall by chasing compile speed.
    #
    # 30 is therefore HEADROOM, not the fix — a killed gate is worse than a slow
    # one (it never reaches a verdict, so it asserts nothing while showing a red
    # badge nobody reads), and 30 still bounds a true zombie an order of
    # magnitude below GitHub's 6h.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          # Release workflow does not need persisted git credentials in
          # the local repo — gh release create uses GITHUB_TOKEN from env
          # explicitly. Closes zizmor's artipacked finding.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0
        with:
          # Disable uv's cache on the release path. A cache poisoned by a
          # prior PR build could otherwise contaminate the release-time
          # `uvx` invocation below. CI gets the cache; release does not.
          # See zizmor's cache-poisoning audit.
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Validate plugin (strict)
        # PINNED to a released CPV tag. Unpinned, this resolved the upstream
        # DEFAULT BRANCH and executed whatever was on it inside a job holding
        # `contents: write` on this repo — a supply-chain hole (one bad commit
        # upstream = write access here) and non-reproducible releases. The pin
        # must match publish.py's local gate exactly, or a release can pass
        # locally and fail here (or worse, the reverse).
        #
        # BUMP PROTOCOL: the ref is pinned in THREE places and they must move
        # together, in one commit — this file, .github/workflows/ci.yml, and
        # scripts/publish.py. (ci.yml was missed the first time and cost a red
        # CI on v0.35.7: unpinned, it resolved CPV's default branch onto the
        # v2.153.2 regression.) Never bump without running the candidate ref
        # against the tree locally first.
        # PINNED AT v5.16.2 as of 2026-09-03 (bumped from v5.4.0: the older pin
        # predates CC 2.1.251's PostModelSwitch hook event and rejected it as a
        # CRITICAL — TRDD-GK35MOXU). publish.py DERIVES its spec from `.cpv-version`
        # (_read_cpv_pin), so the moving sites are `.cpv-version` + the two
        # workflow literals, and tests/test_cpv_pin_ssot.py holds them equal.
        # Verified locally against this tree BEFORE the bump: the candidate
        # ref was run in full --strict from the repo root and the residuals
        # were resolved in the same change, so the gate is green at this pin.
        # Do NOT keep a running scanner-finding narrative here: tracked content is
        # scanned content, so a commentary naming finding codes becomes a finding
        # itself. Per-finding history belongs in the TRDD / .janitor handoff.
        # See the fuller note in .github/workflows/ci.yml.
        #
        # HANG MITIGATION (ported from ci.yml, which has had it for releases):
        # `cpv-remote-validate` intermittently hangs with no progress while the
        # identical local gate in publish.py has already passed on the same commit.
        # Unwrapped, this step simply ran until `timeout-minutes` killed the job —
        # v0.35.3 died at the old 15m bound, v0.35.6 and v0.35.8 at the 30m one.
        # Raising the bound was never a fix; it doubled the stall. Successes take
        # ~3.5 min of VALIDATION, so a 420 s per-attempt cap — now covering validation
        # ONLY, with the uvx build hoisted out below — is generous, and three attempts
        # self-heal the hang (v0.24.4 hit it on the first attempt AND the retry, so
        # retry-once was empirically insufficient).
        #
        # `timeout` exits 124 on a hang — retry that. Any other non-zero is CPV's
        # real 1..4 severity exit: fail fast, no pointless retry.
        run: |
          # The CPV pin is written LITERALLY here and kept equal to `.cpv-version` by
          # tests/test_cpv_pin_ssot.py, which publish.py runs as a gate. It is NOT read
          # from that file at runtime: CPV's validator reads this YAML statically and
          # cannot evaluate a shell variable, so an indirected ref is a MAJOR finding
          # that blocks the publish. Never leave it unpinned — an unpinned resolve takes
          # CPV's default branch, which is a red-release hazard and a supply-chain hole.
          # THE 300s WAS NEVER 300s OF VALIDATION (fixed 2026-07-26, v0.61.1 failure).
          # `timeout` wrapped the WHOLE `uvx` call, which clones + builds CPV from git
          # first: measured 142s (v0.61.1) and 159s (v0.61.0) on a cold runner. So CPV's
          # own work only ever got ~150s of the budget, while the note above calibrated
          # 300s against "successes take ~3.5 min" of VALIDATION — i.e. the cap has been
          # short by ~60s since it was written. v0.61.0 passed only because REPO LINT beat
          # its documented ~198s that run; v0.61.1 added ~1800 lines and the luck ran out,
          # producing three identical 124s and a red release on a plugin that is fine.
          #
          # Warm uv's cache in a separate, UNTIMED step so the cap measures validation
          # alone. `|| true` and a discarded stdout: this step must never be able to fail
          # the release — even if the probe subcommand errors, uvx has already BUILT and
          # cached the package, which is the only thing being bought here.
          uvx --from "git+https://github.com/Emasoft/claude-plugins-validation@v5.16.2" \
            --with pyyaml cpv-remote-validate --help >/dev/null 2>&1 || true

          run_cpv() {
            timeout 420 uvx --from "git+https://github.com/Emasoft/claude-plugins-validation@v5.16.2" \
              --with pyyaml cpv-remote-validate plugin . --strict
          }
          # `run_cpv && { … }; rc=$?` (NOT `if run_cpv; then …; fi; rc=$?`): the
          # `&&` form leaves $? = run_cpv's real exit code on failure, whereas an
          # if-with-no-else swallows it (returns 0), which would make a real
          # failure look like a pass. This is the proven set-e-safe pattern —
          # copied verbatim from ci.yml, which has run it for months.
          rc=0
          for attempt in 1 2 3; do
            run_cpv && { echo "Validation passed (attempt $attempt)"; exit 0; }
            rc=$?
            if [ "$rc" -ne 124 ]; then break; fi   # real validation failure → fail fast, no retry
            echo "::warning::CPV validation hung (timed out at 420s) — attempt $attempt/3"
          done
          echo "::error::Validation failed (exit code $rc)"
          exit "$rc"

      - name: Check if release already exists
        id: release_exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists (created by scripts/publish.py) — skipping create step"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG not yet present — workflow will create it"
          fi

      - name: Generate changelog
        if: steps.release_exists.outputs.exists == 'false'
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
          fi
          echo "$CHANGELOG" > changelog.txt

      - name: Create GitHub Release
        if: steps.release_exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          body_path: changelog.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
