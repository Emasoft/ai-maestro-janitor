# Plugin-side notifier: tells the marketplace repo to refresh this plugin
# whenever plugin files change on the default branch.
#
# SETUP (one-time, per plugin repo):
#   1. Create a PAT with 'repo' scope owned by a marketplace admin.
#   2. Add it as repo secret MARKETPLACE_PAT on THIS plugin repo:
#      gh secret set MARKETPLACE_PAT --repo Emasoft/ai-maestro-janitor --body "$MARKETPLACE_PAT"
#   3. The marketplace repo (Emasoft/ai-maestro-plugins) must already have
#      the same secret configured.

name: Notify Marketplace

on:
  push:
    branches: [main]
    paths:
      # Kept equal to the CPV canonical trigger set. `commands/**` and
      # `agents/**` were MISSING here while this repo ships 3 commands and 3
      # agents, so editing either never notified the marketplace and the
      # catalog silently served a stale component set until an unrelated
      # plugin.json/hooks/skills/scripts change happened to fire the workflow.
      - '.claude-plugin/plugin.json'
      - 'hooks/**'
      - 'commands/**'
      - 'agents/**'
      - 'skills/**'
      - 'scripts/**'

env:
  MARKETPLACE_OWNER: 'Emasoft'
  MARKETPLACE_REPO: 'ai-maestro-plugins'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # bound the job — gh-actions rule (task #243)
    # CPV canon: NO-OP when MARKETPLACE_PAT is not configured. `secrets` is
    # readable from a job-level env: mapping, so expose its presence as a
    # boolean and gate every step that needs it. Without this the dispatch
    # step fails with a gh 404/auth error and paints a RED associated
    # workflow on an otherwise-good release — a red that means "the secret
    # is absent", which is indistinguishable at a glance from "the notify
    # chain is broken". Gated, the job prints a notice and ends GREEN.
    env:
      HAS_MARKETPLACE_PAT: ${{ secrets.MARKETPLACE_PAT != '' }}
    steps:
      - name: Check marketplace secret
        # Always runs; the gated steps below skip when the PAT is absent.
        run: |
          if [ "$HAS_MARKETPLACE_PAT" = "true" ]; then
            echo "MARKETPLACE_PAT is configured — proceeding with marketplace notification."
          else
            echo "::notice::MARKETPLACE_PAT secret is not set — skipping marketplace notification (no-op)."
          fi

      - name: Checkout plugin
        if: env.HAS_MARKETPLACE_PAT == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Only reads plugin.json; the marketplace dispatch step uses
          # secrets.MARKETPLACE_PAT explicitly, not the persisted git
          # extraheader. zizmor: artipacked.
          persist-credentials: false

      - name: Extract plugin name and version
        id: plugin
        if: env.HAS_MARKETPLACE_PAT == 'true'
        run: |
          set -euo pipefail
          NAME=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['name'])")
          VERSION=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          {
            echo "name=$NAME"
            echo "version=$VERSION"
            echo "ref=${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch plugin-updated to marketplace
        if: env.HAS_MARKETPLACE_PAT == 'true'
        # Canon's defensive "second-latest" pin: v4.0.0, NOT the bleeding-edge
        # v4.0.1 this repo carried. v4.0.1's SHA was the user-visible symptom of
        # the 2026-05-26 GitHub Actions codeload auth outage, so CPV canon stays
        # one tag behind on the dispatch action as a hedge. Adopted from canon —
        # this repo had no recorded reason to be ahead of it.
        uses: peter-evans/repository-dispatch@5fc4efd1a4797ddb68ffd0714a238564e4cc0e6f  # v4.0.0
        with:
          token: ${{ secrets.MARKETPLACE_PAT }}
          repository: ${{ env.MARKETPLACE_OWNER }}/${{ env.MARKETPLACE_REPO }}
          event-type: plugin-updated
          client-payload: |
            {
              "plugin": "${{ steps.plugin.outputs.name }}",
              "version": "${{ steps.plugin.outputs.version }}",
              "ref": "${{ steps.plugin.outputs.ref }}",
              "source_repo": "${{ github.repository }}",
              "triggered_by": "${{ github.actor }}"
            }

      - name: Job summary
        if: env.HAS_MARKETPLACE_PAT == 'true'
        # Step-output values come from plugin.json (in-repo content) so
        # they're not attacker-controllable in the strict sense — but
        # zizmor's template-injection audit flags ${{ ... }} expansion
        # in `run:` blocks regardless of source. Routing through env
        # vars closes the audit, and is a defense-in-depth measure
        # against any future code path that introduces user input into
        # plugin.json.
        env:
          PLUGIN_NAME: ${{ steps.plugin.outputs.name }}
          PLUGIN_VERSION: ${{ steps.plugin.outputs.version }}
          PLUGIN_REF: ${{ steps.plugin.outputs.ref }}
        run: |
          {
            echo "## Marketplace Notification"
            echo ""
            echo "- Plugin: $PLUGIN_NAME"
            echo "- Version: $PLUGIN_VERSION"
            echo "- Ref: $PLUGIN_REF"
            echo "- Target: $MARKETPLACE_OWNER/$MARKETPLACE_REPO"
          } >> "$GITHUB_STEP_SUMMARY"
