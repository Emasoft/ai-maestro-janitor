# Build the `memgrep` binary for macOS + Linux (arm64 + x64) and attach the
# binaries plus a combined SHA256SUMS to the GitHub release for the pushed tag.
# This lets other plugins and end-users grab a prebuilt memgrep with NO Rust
# toolchain (issue #16, item 1).
#
# Two-phase: a `build` matrix produces one binary + its checksum per target as
# a workflow artifact (NO release permission — least privilege), then a single
# `release` job collects every artifact and uploads them to the tag's release
# (the ONLY job granted `contents: write`).

name: memgrep release binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

# Default deny — every job opts in to the exact scope it needs.
permissions: {}

# A tag push is a one-shot event; cancel a superseded run for the same ref
# (e.g. a tag force-moved) so two uploads never race for the same release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build memgrep (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      # Reading the repo source is all a build needs. NO write scope here —
      # the release upload is isolated in the `release` job below.
      contents: read
    strategy:
      # Build every target even if one fails, so a single flaky runner does not
      # withhold the binaries that DID build from the release-collection step.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: memgrep-darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: memgrep-darwin-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: memgrep-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: memgrep-linux-arm64
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
        with:
          # No git credential needs to persist into the local repo for a build;
          # closes zizmor's artipacked finding (the implicit extraheader git
          # config would otherwise leak into the artifact upload below).
          persist-credentials: false

      # Rust is preinstalled on GitHub-hosted runners, so we drive rustup/cargo
      # directly via run: rather than pin a third-party toolchain action.
      # `matrix.target` is a fixed, workflow-controlled value (never attacker
      # input), so interpolating it into rustup is not an injection vector.
      - name: Ensure the Rust target is installed
        run: rustup target add "${{ matrix.target }}"

      - name: Build memgrep (release)
        run: cargo build --release --locked --target "${{ matrix.target }}" --manifest-path scripts/memgrep/Cargo.toml

      # Stage the built binary under the asset name and compute its checksum.
      # macOS ships `shasum`; Linux ships `sha256sum` — pick per-OS. The `.sha256`
      # file records the checksum against the ASSET name (not the build path) so
      # the line is meaningful after download.
      - name: Stage binary + checksum
        env:
          ASSET: ${{ matrix.asset }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${TARGET}/release/memgrep" "dist/${ASSET}"
          chmod +x "dist/${ASSET}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ASSET}" > "${ASSET}.sha256"
          else
            shasum -a 256 "${ASSET}" > "${ASSET}.sha256"
          fi
          echo "Built ${ASSET}:"
          cat "${ASSET}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attach binaries to the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The ONLY job with write scope — it uploads assets onto the tag's release.
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts

      # Flatten the per-target artifact folders into one dir and build a single
      # combined SHA256SUMS from the per-binary `.sha256` files, so a verifier can
      # `sha256sum -c SHA256SUMS` against all assets at once.
      - name: Collect binaries + combined checksums
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -type f -name 'memgrep-*' ! -name '*.sha256' -exec cp {} out/ \;
          ( cd out && cat ../artifacts/*/*.sha256 > SHA256SUMS )
          echo "Release assets:"
          ls -l out
          echo "SHA256SUMS:"
          cat out/SHA256SUMS

      # Attach the binaries with `gh release upload` (provided by the runner) so
      # no third-party release action is needed. The release itself is created by
      # scripts/publish.py / the Release workflow; `--clobber` makes re-runs (and a
      # workflow_dispatch on an existing release) idempotent. The tag is passed via
      # an env var, never interpolated into the shell, so a crafted ref can't inject.
      - name: Upload binaries + checksums to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" out/memgrep-* out/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
