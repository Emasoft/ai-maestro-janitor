name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Only one shell script remains after the bash → Python port
      # (12263f2): scripts/dispatch.sh is the back-compat wrapper for
      # cron entries that still reference dispatch.sh; everything else
      # is now Python under PEP 723. The pre-push hook is also bash and
      # belongs in the same shellcheck pass.
      - name: Lint shell scripts
        run: shellcheck scripts/dispatch.sh .githooks/pre-push

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Ruff check (all Python sources)
        run: uvx ruff check scripts/

      - name: Pyright (type check)
        run: uvx --with pyright pyright scripts/

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Validate plugin (strict)
        run: |
          set +e
          uvx --from git+https://github.com/Emasoft/claude-plugins-validation --with pyyaml cpv-remote-validate plugin . --strict
          exit_code=$?
          set -e
          if [ $exit_code -eq 0 ]; then
            echo "Validation passed"
            exit 0
          else
            echo "::error::Validation failed (exit code $exit_code)"
            exit $exit_code
          fi

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Validate hooks.json
        run: |
          uv run --quiet --python 3.12 python -c "import json,sys; json.load(open('hooks/hooks.json')); print('hooks.json is valid JSON')"

      - name: Smoke-run dispatch.py
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}
        run: |
          # The heartbeat is bounded by per-detector timeouts (5–30s);
          # a top-level wall clock of 60s is plenty even on a cold
          # GitHub runner with no uv cache.
          timeout 60 ./scripts/dispatch.py || rc=$?
          # rc=0 → silent (no drift); rc=124 → hit the 60s wall clock,
          # which is a CI failure signal worth surfacing.
          [ "${rc:-0}" -eq 124 ] && { echo "::error::dispatch.py exceeded 60s wall clock"; exit 1; } || true

      - name: Smoke-run each hook
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}
        run: |
          for h in scripts/hooks/*.py; do
            echo "=== $h ==="
            timeout 30 ./"$h" || rc=$?
            [ "${rc:-0}" -eq 124 ] && { echo "::error::$h exceeded 30s wall clock"; exit 1; } || true
          done
