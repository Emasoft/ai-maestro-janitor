name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      # Only one shell script remains after the bash → Python port
      # (12263f2): scripts/dispatch.sh is the back-compat wrapper for
      # cron entries that still reference dispatch.sh; everything else
      # is now Python under PEP 723. The pre-push hook is also bash and
      # belongs in the same shellcheck pass. shellcheck is preinstalled
      # on ubuntu-latest runners, so no install step is needed.
      - name: Lint shell scripts
        run: shellcheck scripts/dispatch.sh git-hooks/pre-push

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Ruff check (all Python sources)
        run: uvx ruff check scripts/ tests/

      # pyrightconfig.json points at `.venv` (venvPath/venv), which exists on a dev
      # machine and NOT on a clean runner — without this sync, every `import pytest`
      # in tests/ is unresolvable and the gate fails on 100+ phantom errors (first
      # observed on run 31844013197, the job's first execution). `--extra dev` for
      # the same reason as the Pytest step below: pytest/tiktoken live in the dev
      # extras, and tests/ imports them.
      - name: Sync deps so pyright can resolve imports
        run: uv sync --extra dev

      # No path argument: pyrightconfig.json's `include` covers scripts/ AND tests/.
      # tests/ was outside this gate until 2026-08-13 — 176 real type errors had accumulated
      # there unseen, in the very files that are supposed to catch defects. A gate that skips the
      # tests cannot notice a test asserting against a signature that no longer exists.
      - name: Pyright (type check)
        run: uvx --with pyright pyright

  # Until 2026-08-14 the 15k-test suite ran ONLY inside publish.py's release gate,
  # so every push between releases was guarded by lint and types and by no test at
  # all. That window is exactly where the expensive defects live: a helper with no
  # production caller, a docstring promising two guards over code running one, a
  # `.git` path wrong in a linked worktree — ruff and pyright are structurally
  # blind to all three, and each one shipped green. A gate that runs only at
  # release lets a week of them compound before anything goes red.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          # Full history, NOT the depth-1 default: check5's `git log -S` symbol-in-history
          # probe (and test_real_deleted_symbols_are_still_found, which exercises it
          # against this repo's own past) finds nothing in a shallow clone — the test
          # failed on run 31850287797 for exactly this. History for this repo costs a few
          # seconds; a skip-if-shallow would leave the probe untested everywhere but a
          # dev box.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0

      - name: Set up Python
        run: uv python install 3.12

      # `--extra dev` is load-bearing: pytest and pytest-xdist live in
      # [project.optional-dependencies].dev. A bare `uv run pytest` succeeds
      # locally only because the developer's .venv already has them installed, so
      # dropping the flag fails on a clean runner and nowhere else.
      #
      # `-n auto` matches how the suite is actually run. `-m "not integration"`
      # excludes the real-daemon-spawn tests (tests/test_daemon_integration.py,
      # TRDD-ASA7EBJQ / janitor#245): they spawn a REAL long-lived daemon
      # process and wait on wall-clock deadlines, which fails under parallel
      # load for reasons that have nothing to do with correctness (measured:
      # PASS in 6s serially, FAIL a 30s deadline under `-n 12`). They run
      # below as their own serial step instead.
      # `--timeout=300 --timeout-method=thread`: the job's first run (31844013197) hung
      # SILENTLY at 99% for 22 minutes until timeout-minutes killed it, leaving no name
      # for the hanging test. A per-test cap converts any future hang into a named
      # failure. Thread method because signal-based timeouts do not fire inside xdist
      # workers blocked in C calls.
      - name: Pytest
        # --dist loadgroup: same as the default `load` for ungrouped tests, but keeps
        # xdist_group-marked tests (the order-dependent state-cache-isolation pair) on
        # one worker — plain `load` split them and failed a publish gate on 2026-08-18.
        run: uv run --extra dev pytest -q -n auto --dist loadgroup -m "not integration" --timeout=300 --timeout-method=thread

      # The real-daemon-spawn integration suite — SERIAL (no -n), its own
      # step, so it never competes with the parallel unit workers for CPU.
      - name: Pytest (daemon integration, serial)
        run: uv run --extra dev pytest -q -m integration

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Validate plugin (strict)
        run: |
          # The CPV pin is written LITERALLY here and kept equal to `.cpv-version` by
          # tests/test_cpv_pin_ssot.py, which publish.py runs as a gate — so drift
          # cannot reach the remote, and `.cpv-version` stays the one place a human
          # edits the tag.
          #
          # It is deliberately NOT `@${SOME_VAR}` read from that file at runtime. CPV's
          # validator inspects this YAML statically and cannot evaluate a shell
          # variable, so an indirected ref is a MAJOR finding that blocks the publish
          # (measured 2026-08-01, 3 findings). The static form is also the auditable
          # one: a reviewer sees which CPV version CI executes without tracing a file
          # read — the same reason an unpinned resolve is refused below.
          # CPV remote validation occasionally HANGS on a flaky remote/network
          # call (observed v0.8.5 AND v0.24.4: the REPO-LINT stage ran with no
          # progress while publish.py's identical local CPV --strict had already
          # passed on the same commit). Bound each attempt with `timeout` and
          # retry up to TWICE on a hang (exit 124) — v0.24.4 hit the hang on BOTH
          # the first attempt and the single retry, so retry-once was empirically
          # insufficient (false-red on a good release, needed a manual re-run); 3
          # attempts self-heal that case. A real validation failure (any other
          # non-zero — CPV's 1-4 severity exits) fails fast WITHOUT a pointless
          # retry. The job-level timeout-minutes is the hard backstop.
          # BUMP PROTOCOL: edit `.cpv-version`, then run the SSOT test — it names every
          # site that must move with it and fails until they match. Never bump without
          # first running the new ref against the tree locally.
          # Do NOT keep a running scanner-finding narrative in this file: tracked
          # content is scanned content, so a commentary naming finding codes becomes a
          # finding itself. Per-finding history belongs in the TRDD / .janitor handoff.
          #
          # This call site was left UNPINNED when the other two were pinned, and it
          # cost a red CI on the v0.35.7 release: it resolved CPV's default branch,
          # picked up v2.153.2, and failed on a CRITICAL we did not cause and could
          # not fix — while publish.py's pinned local gate passed on the same commit.
          # An unpinned resolve in a job is also a supply-chain hole: CI executes
          # whatever is on that branch.
          run_cpv() {
            timeout 300 uvx --from "git+https://github.com/Emasoft/claude-plugins-validation@v5.4.0" \
              --with pyyaml cpv-remote-validate plugin . --strict
          }
          # `run_cpv && { … }; rc=$?` (NOT `if run_cpv; then …; fi; rc=$?`): the
          # `&&` form leaves $? = run_cpv's real exit code on failure, whereas an
          # if-with-no-else swallows it (returns 0), which would make a real
          # failure look like a pass. This is the proven set-e-safe pattern.
          rc=0
          for attempt in 1 2 3; do
            run_cpv && { echo "Validation passed (attempt $attempt)"; exit 0; }
            rc=$?
            if [ "$rc" -ne 124 ]; then break; fi   # real validation failure → fail fast, no retry
            echo "::warning::CPV validation hung (timed out at 300s) — attempt $attempt/3"
          done
          echo "::error::Validation failed (exit code $rc)"
          exit "$rc"

  # Exercise the RELEASE pipeline's build+stage path on EVERY push — the
  # recurrence guard for the v0.7.0 incident, where the memgrep-release
  # workflow's staging step (tag-trigger-only, so never exercised pre-tag)
  # copied from a wrong target/ path and failed on all four platforms at the
  # one moment it mattered. This job builds with an explicit --target (the
  # same triple-subdir layout the release matrix produces) and runs the SAME
  # scripts/memgrep/stage.sh the release workflow calls, so any drift between
  # build output and staging breaks CI immediately instead of at tag time.
  memgrep-build:
    name: memgrep build+stage smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Build memgrep exactly as the release does
        run: |
          rustup target add x86_64-unknown-linux-gnu
          cargo build --release --locked --target x86_64-unknown-linux-gnu --manifest-path scripts/memgrep/Cargo.toml

      - name: Stage via the shared release script
        run: bash scripts/memgrep/stage.sh x86_64-unknown-linux-gnu memgrep-linux-x64

      # The staged binary lives under dist/ — a directory CREATED BY the stage
      # step above, so it never exists in the repo; reference it through an env
      # var rather than a literal path (a literal would trip path-exists checks
      # that cannot know about mid-job build artifacts).
      - name: Staged binary runs
        env:
          ASSET: memgrep-linux-x64
        run: |
          "dist/${ASSET}" --help >/dev/null
          echo "staged binary (${ASSET}) executes OK"

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Validate hooks.json
        run: |
          uv run --quiet --python 3.12 python -c "import json,sys; json.load(open('hooks/hooks.json')); print('hooks.json is valid JSON')"

      - name: Smoke-run dispatch.py
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}
        run: |
          # The heartbeat is bounded by per-detector timeouts (5–30s);
          # a top-level wall clock of 60s is plenty even on a cold
          # GitHub runner with no uv cache.
          timeout 60 ./scripts/dispatch.py || rc=$?
          # rc=0 → silent (no drift); rc=124 → hit the 60s wall clock,
          # which is a CI failure signal worth surfacing.
          [ "${rc:-0}" -eq 124 ] && { echo "::error::dispatch.py exceeded 60s wall clock"; exit 1; } || true

      - name: Smoke-run each hook
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}
        run: |
          for h in scripts/hooks/*.py; do
            echo "=== $h ==="
            timeout 30 ./"$h" || rc=$?
            [ "${rc:-0}" -eq 124 ] && { echo "::error::$h exceeded 30s wall clock"; exit 1; } || true
          done

      # STRICT per-detector smoke (the v0.7.1 lesson): every detector runs via its
      # own `uv run --script` shebang with ONLY its PEP-723-declared deps, so an
      # undeclared third-party import (memory-scope-leak's transitive PyYAML)
      # crashes at import time on EVERY heartbeat fire — and the tolerant
      # dispatch smoke above masked it (dispatch deliberately survives detector
      # failures; CI must not). Each detector must exit 0 AND emit no Traceback.
      - name: Strict-run each detector (exit 0, no Traceback)
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}
        run: |
          fail=0
          for d in scripts/detectors/*.py; do
            echo "=== $d ==="
            out=$(timeout 60 ./"$d" --one-shot 2>&1); rc=$?
            printf '%s\n' "$out"
            if [ "$rc" -ne 0 ]; then
              echo "::error::$d exited $rc"; fail=1
            fi
            if printf '%s' "$out" | grep -q 'Traceback (most recent call last)'; then
              echo "::error::$d raised an unhandled exception"; fail=1
            fi
          done
          exit "$fail"
